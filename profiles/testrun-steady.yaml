# k6 Operator TestRun: runs profiles/steady_120rps.js IN-CLUSTER (never from a
# laptop or CI runner — the network path under test must be the real one) and
# remote-writes client-side series into the same Prometheus the server metrics
# land in, because the safety-plane promProbes read k6's series (Phase 5).
#
# ConfigMap first:  kubectl create configmap steady-120rps -n load \
#                     --from-file=archive.js=profiles/steady_120rps.js
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: steady-120rps
  namespace: load
spec:
  parallelism: 1
  script:
    configMap:
      name: steady-120rps
      file: archive.js
  arguments: -o experimental-prometheus-rw --tag testrun=steady-120rps
  runner:
    image: grafana/k6:2.2.0   # pinned to the plan version; never latest
    env:
      - name: TARGET_URL
        value: http://order-api.target-app:8080
      - name: LOAD_DURATION
        value: "45m"          # covers a full six-experiment suite plus warmup
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: http://kps-kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write
      # Defect D-B (found by the Phase 7 gate): with trend stats exported as
      # GAUGES, k6 ships a statistic accumulated since the START OF THE TEST
      # RUN. Its memory is the whole run, so it cannot resolve a 60s fault
      # window and it is not comparable to a 30s-windowed SLO — a p99 that
      # spent the first minute of a 25-minute run at JVM cold start stays
      # elevated for the rest of it, and every latency invariant reads that
      # instead of the fault. Native histograms ship the DISTRIBUTION and let
      # Prometheus compute the quantile over the window actually asked for.
      # Needs `--enable-feature=native-histograms` on Prometheus; see
      # monitoring/kps-values.yaml.
      # K6_FEATURES, not K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: k6 2.2.0
      # accepts the latter but logs it as a deprecated alias, and a
      # load-bearing signal riding a deprecated alias stops working on the
      # next k6 bump without anyone touching it.
      - name: K6_FEATURES
        value: native-histograms
      # Kept for the gauge-based panels that only ever read avg/min/max, where
      # a run-cumulative value is honest. Never for a windowed SLI.
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: "p(99),p(95),avg,min,max"
      - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
        value: 5s
    resources:
      requests: { memory: 256Mi, cpu: 250m }
      limits: { memory: 512Mi }
