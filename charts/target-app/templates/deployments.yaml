{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ .name }}
spec:
  {{- if not (and $.Values.hpa.enabled (eq $.Values.hpa.target .name)) }}
  # Omitted when an HPA owns this deployment: the autoscaler is authoritative for
  # .spec.replicas, and Helm 4 defaults to SERVER-SIDE APPLY, so a chart that also
  # declares replicas gets an explicit field-ownership conflict with
  # kube-controller-manager rather than silently fighting it.
  replicas: {{ .replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .name }}:{{ $.Values.imageTag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: CHAOS_FIXTURES_ENABLED
              value: {{ $.Values.fixturesEnabled | quote }}
            {{- with .env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The startup assertion aborts boot when resilience meters are missing,
          # so readiness failing IS the metrics guard (skill: fail loudly).
          # startupProbe gives JVM boot up to 3 min on a crowded node; liveness
          # only takes over AFTER startup succeeds, so slow boots are not killed
          # mid-flight (that restart loop looks exactly like a crash, with no error).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3          # 1s default flaps under open-model load
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 4        # a saturated-but-alive gateway is not dead
          resources:
            {{- toYaml (default $.Values.resources .resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ .name }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
---
{{- end }}
