namespace: target-app
imageTag: dev

# Per-skill: ephemeral-storage limits are REQUIRED on disk-fill targets — without
# them the experiment has nothing to exceed and silently does nothing. CPU limits
# interact with pod-cpu-hog (the hog gets throttled): that is why that experiment
# asserts throttle ratio, never "the spike went away".
resources:
  limits:
    ephemeral-storage: 1Gi
    memory: 512Mi
    cpu: 500m
  requests:
    ephemeral-storage: 512Mi
    memory: 256Mi
    cpu: 200m

fixturesEnabled: "true"   # chaos namespace — never true in a public build

services:
  - name: order-api
    port: 8080
    replicas: 2
    # Gateway does its own 120rps PLUS the fan-out to two services; 500m starves
    # a JIT-cold JVM into liveness kills under open-model load.
    resources:
      limits:
        ephemeral-storage: 1Gi
        memory: 512Mi
        cpu: "1"
      requests:
        ephemeral-storage: 512Mi
        memory: 256Mi
        cpu: 300m
    env:
      - name: PAYMENT_SERVICE_URL
        value: http://payment-service:8081
      - name: INVENTORY_SERVICE_URL
        value: http://inventory-service:8082
  - name: payment-service
    port: 8081
    replicas: 2
    # Right-sized after measurement, not guesswork: at 120 rps each replica draws
    # ~340m. Against the original 200m request that is 170% — above the HPA's 70%
    # scale-up target — so the deployment sat permanently at maxReplicas and the
    # CPU-spike experiment could not observe a reaction from a system that had
    # already reacted. An HPA whose target is exceeded at steady state is
    # misconfigured; 600m puts steady state near 57% and leaves the autoscaler
    # somewhere to go.
    resources:
      limits:
        ephemeral-storage: 1Gi
        memory: 512Mi
        cpu: 1200m
      requests:
        ephemeral-storage: 512Mi
        memory: 256Mi
        cpu: 600m
    env: []
  - name: inventory-service
    port: 8082
    replicas: 2
    env:
      - name: DB_URL
        value: jdbc:postgresql://postgres:5432/inventory
      - name: DB_USER
        value: chaosproof
      - name: DB_PASSWORD
        value: chaosproof

# HPA for the CPU-spike experiment (#5). Requires metrics-server.
hpa:
  enabled: true
  target: payment-service
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

postgres:
  image: postgres:18.6-alpine
