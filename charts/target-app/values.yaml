namespace: target-app
imageTag: dev

# Per-skill: ephemeral-storage limits are REQUIRED on disk-fill targets — without
# them the experiment has nothing to exceed and silently does nothing. CPU limits
# interact with pod-cpu-hog (the hog gets throttled): that is why that experiment
# asserts throttle ratio, never "the spike went away".
resources:
  limits:
    ephemeral-storage: 1Gi
    memory: 512Mi
    cpu: 500m
  requests:
    ephemeral-storage: 512Mi
    memory: 256Mi
    cpu: 200m

fixturesEnabled: "true"   # chaos namespace — never true in a public build

services:
  - name: order-api
    port: 8080
    replicas: 2
    env:
      - name: PAYMENT_SERVICE_URL
        value: http://payment-service:8081
      - name: INVENTORY_SERVICE_URL
        value: http://inventory-service:8082
  - name: payment-service
    port: 8081
    replicas: 2
    env: []
  - name: inventory-service
    port: 8082
    replicas: 2
    env:
      - name: DB_URL
        value: jdbc:postgresql://postgres:5432/inventory
      - name: DB_USER
        value: chaosproof
      - name: DB_PASSWORD
        value: chaosproof

postgres:
  image: postgres:18.6-alpine
