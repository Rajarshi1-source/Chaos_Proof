apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaosproof
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: chaosproof
    app.kubernetes.io/component: framework
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0. Never take the framework down to bring it up — a
      # window with no framework is a window in which a fault can be injected
      # with nothing watching it.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chaosproof
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaosproof
        app.kubernetes.io/component: framework
      annotations:
        # Roll the pods when the image tag changes even if nothing else did.
        chaosproof.io/image-tag: {{ .Values.image.tag | quote }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # 900s, deliberately long. On SIGTERM the runner stops consuming the
      # queue and finishes the in-flight experiment INCLUDING its cleanup saga
      # before exiting. A 60s grace period would routinely orphan faults, and
      # an interrupted execution is an INVALID run *and* a fault left injected.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: framework
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "src.api:app", "--host", "0.0.0.0",
                    "--port", "{{ .Values.api.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: CHAOSPROOF_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: {{ .Values.db.secretKey }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # Readiness is gated on the MEASUREMENT PLANE, not on the process
          # being alive: /api/health checks the evidence store. A framework
          # that starts without its measurement plane produces INVALID runs and
          # burns the schedule producing them.
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            # 30 x 30s = 15 minutes before a restart. Longer than the liveness
            # default on purpose: an experiment plus its cleanup saga can hold
            # the process busy, and restarting the runner mid-fault is exactly
            # the orphan the CronJob exists to mop up. Liveness is for a wedged
            # process, not a slow one.
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chaosproof
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: chaosproof
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chaosproof
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
