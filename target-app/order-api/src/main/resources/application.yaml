server:
  port: 8080

spring:
  application:
    name: order-api
  threads:
    virtual:
      enabled: true   # virtual threads for blocking downstream calls (re-baseline flakiness after changing)

chaosproof:
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8081}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # NEVER unset: every ChaosProof query filters on this
    distribution:
      percentiles-histogram:
        http.server.requests: true              # _bucket series for histogram_quantile()

resilience4j:
  circuitbreaker:
    instances:
      paymentService:                           # NEVER rename: experiments assert on this name
        registerHealthIndicator: true
        slidingWindowSize: 10
        # minimumNumberOfCalls MUST be <= slidingWindowSize. Resilience4j defaults it
        # to 100 (DEFAULT_MINIMUM_NUMBER_OF_CALLS), so a COUNT_BASED window of 10
        # could never reach the minimum, the failure rate was never computable, and
        # this breaker was STRUCTURALLY INCAPABLE OF OPENING. The metrics published,
        # the startup assertion passed, and the pattern still could not do its job -
        # only injecting a real partition revealed it (execution #3, FALSIFIED).
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      inventoryService:                         # NEVER rename
        maxAttempts: 3        # amplification preserved deliberately - declared in the contract (Phase 9)
        waitDuration: 500ms
