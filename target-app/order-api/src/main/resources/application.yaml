server:
  port: 8080

spring:
  application:
    name: order-api
  threads:
    virtual:
      enabled: true   # virtual threads for blocking downstream calls (re-baseline flakiness after changing)

chaosproof:
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8081}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}   # NEVER unset: every ChaosProof query filters on this
    distribution:
      percentiles-histogram:
        http.server.requests: true              # _bucket series for histogram_quantile()

resilience4j:
  circuitbreaker:
    instances:
      paymentService:                           # NEVER rename: experiments assert on this name
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      inventoryService:                         # NEVER rename
        maxAttempts: 3        # amplification preserved deliberately - declared in the contract (Phase 9)
        waitDuration: 500ms
