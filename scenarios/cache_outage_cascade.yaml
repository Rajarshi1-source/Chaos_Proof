# The cascade (§18.2). Redis becomes unavailable, forcing inventory-service onto
# the database; IF database latency actually crosses 200ms we add contention on
# top, simulating a cache stampede.
#
# THE TRIGGER IS CONDITIONAL, NOT A STOPWATCH, and that is the whole design.
# `db_pressure` fires when the cascade ACTUALLY PROPAGATES, not after a fixed
# delay. When it does NOT fire within its timeout, that is the most valuable
# thing this scenario can produce: the stale-cache fallback absorbed the outage
# completely, proved rather than assumed. A delay-only DAG can never produce
# that result — it would inject the second fault regardless and then report on a
# cascade it created itself.
#
# RUNNABILITY, stated here rather than discovered at injection time:
#
#   db_query_seconds   PRESENT. TimedInventoryRepository carries
#                      @Timed(value="db_query", histogram=true), and because
#                      DbReader is a SEPARATE bean that injects it, the Spring
#                      proxy actually applies — the failure mode that
#                      annotation is prone to is already avoided. D-I is done.
#
#   redis              ABSENT, and this is what makes the scenario
#                      unrunnable today. inventory-service caches in a
#                      ConcurrentHashMap (InMemoryCacheClient); there is no
#                      redis client, no deployment, and an in-process cache
#                      cannot be pod-deleted independently of its service.
#
# Deploying a redis to satisfy stage 1 was considered and REJECTED. It would
# mean replacing a service's caching architecture so an experiment has
# something to kill — and worse, a bolted-on redis would be OPTIONAL to
# inventory-service, since the in-memory path already works. Killing it would
# produce no DB pressure, the trigger would not fire, and the scenario would
# report `did_not_propagate`: "the stale-cache fallback absorbed the outage
# completely." That is this project's headline finding, arrived at vacuously.
# A false version of the best result is worse than not having it.
#
# The cascade this topology COULD express — slow or kill postgres, watch
# db_query_seconds rise, watch the stale fallback serve — targets a stateful
# component that `deny-stateful-targets` refuses, and widening a policy rule to
# make a run succeed is the one fix that is never available.
#
# So this scenario is exercised hermetically (22 tests in
# chaos-framework/tests/test_cascade.py cover trigger-fires, trigger-never-
# fires, upstream-skip, mid-cascade abort, reverse-order teardown, and teardown
# continuing past a failure) and is NOT run live. What would change that: a
# redis-backed cache that inventory-service genuinely depends on.
scenario:
  name: cache_outage_cascade
  description: >
    Redis becomes unavailable, forcing inventory-service onto the database. If DB
    latency crosses 200ms we additionally add 100ms of network latency,
    simulating the contention a real cache stampede produces. Tests whether the
    stale-cache fallback and the DB retry budget together prevent a user-visible
    outage.

  hypothesis:
    description: >
      The system degrades gracefully: client availability stays >=97% and P99
      stays under 1500ms throughout, because inventory-service serves stale
      catalogue data and order-api's bulkhead prevents thread-pool exhaustion
      from spreading.
    invariants:
      - name: availability
        source: k6
        metric: client_availability
        comparator: ">="
        threshold: 0.97
        tolerance_s: 20
      - name: p99
        source: k6
        metric: client_p99_ms
        comparator: "<="
        threshold: 1500
        tolerance_s: 30
      - name: no_thread_pool_exhaustion
        source: prometheus
        metric: bulkhead_available_calls
        comparator: ">"
        threshold: 0
        # ZERO tolerance. Thread-pool exhaustion IS the cascade: the moment it
        # happens the failure has stopped being contained and started spreading,
        # so there is no budget for it to be briefly true.
        tolerance_s: 0

  stages:
    - id: kill_cache
      at: 0s
      fault: pod-delete
      target: { app: redis, namespace: target-app }

    - id: db_pressure
      after: kill_cache
      trigger:
        # Needs D-I's `db_query_seconds` histogram on inventory-service.
        promql: histogram_quantile(0.99, sum(rate(db_query_seconds_bucket[30s])) by (le))
        comparator: ">"
        threshold: 0.200
        # If it never trips: "cascade did not propagate" — recorded as a
        # finding, not as a timeout error.
        timeout_s: 90
      fault: pod-network-latency
      target: { app: inventory-service, namespace: target-app }
      params: { NETWORK_LATENCY: "100" }

    - id: observe_only
      after: db_pressure
      duration: 60s
      # Retry storms and queue growth appear AFTER injection stops. A
      # fault-then-immediately-validate loop misses them entirely, so this stage
      # watches amplification without adding to it.
      fault: none

  # A DAG multiplies blast radius, so the abort path is the non-trivial one.
  # Aborting stage 2 while stage 1 is active halts BOTH, and cleanup runs stage
  # teardowns in reverse dependency order.
  abort_conditions:
    - name: total_collapse
      source: k6
      metric: client_availability
      comparator: "<"
      threshold: 0.70
    - name: cascade_escaped
      source: prometheus
      metric: other_namespace_5xx_rate
      comparator: ">"
      threshold: 0.5
