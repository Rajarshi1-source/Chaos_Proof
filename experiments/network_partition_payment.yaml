# Experiment 3: 100% packet loss to payment-service — the partition.
# The claim: order-api's circuit breaker OPENS (observable via the state gauge and
# short-circuited calls) and the queue fallback keeps checkout available. This is
# the pattern the whole project leads with: an unobservable breaker is unverifiable.
experiment:
  name: network_partition_payment
  litmus_fault: pod-network-loss
  target: { namespace: target-app, app: payment-service }
  fault_duration_s: 60
  recovery_window_s: 120
  chaos_fixture: hungry-worker   # co-located trigger; the fault itself is Litmus-injected
  params:
    NETWORK_PACKET_LOSS_PERCENTAGE: "100"

  load_profile: profiles/steady_120rps.js
  min_rps_floor: 90

  hypothesis:
    # v2 (30 Aug 2026): circuit_breaker_opens and breaker_short_circuits were
    # declared as RECOVERY invariants, which additionally require the signal to
    # hold through the window's end. That made them unsatisfiable by a correctly
    # behaving breaker — it opens, then closes once the fault lifts, and a
    # recovery invariant voids on the later breach. Both are ACTIVATION claims:
    # the pattern must fire, not stay fired. See engine._check_activation.
    #
    # Bumping this version resets the experiment's clean-run count, so it drops
    # back to an uncharacterised bootstrap entry in ci/gating-experiments.yaml.
    # That is the rule working: a re-stated hypothesis has not earned the
    # authority the old one had.
    version: 2
    description: >
      Under a full partition to payment-service, client availability stays >=95%:
      the first calls burn the 3s timeout (P99 spikes), the circuit breaker on
      order-api opens within ~30s of first failures (sliding window 10, threshold
      50%), after which the QUEUED fallback serves instantly. The breaker's opening
      is asserted on its published state — and on it actually short-circuiting calls.

    invariants:
      - name: availability_via_fallback
        source: k6
        metric: client_availability
        comparator: ">="
        threshold: 0.95
        tolerance_s: 30                 # the pre-open window burns timeouts

      - name: circuit_breaker_opens
        source: prometheus
        metric: cb_payment_open
        comparator: ">="
        threshold: 1                    # state="open" gauge flips to 1
        activates_within_s: 90          # must REACH 1 within 90s of window start.
                                        # Not "and stay at 1": a breaker still open
                                        # at the end of the recovery window is a
                                        # problem, not a pass.

      - name: breaker_short_circuits
        source: prometheus
        metric: cb_payment_not_permitted_rate
        comparator: ">"
        threshold: 0
        activates_within_s: 90          # proves the breaker DID something, not just
                                        # that a gauge moved. Same reasoning: calls
                                        # stop being rejected once it closes again.

      - name: no_server_5xx_storm
        source: prometheus
        metric: server_5xx_rate
        comparator: "<="
        threshold: 1.0
        tolerance_s: 30

    abort_conditions:
      - name: availability_collapse
        source: k6
        metric: client_availability
        comparator: "<"
        threshold: 0.80
      - name: unrelated_namespace_impact
        source: prometheus
        metric: other_namespace_5xx_rate
        comparator: ">"
        threshold: 0.5
