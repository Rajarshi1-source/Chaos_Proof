# The CI load plane. `kubectl apply -f k6/testrun-ci.yaml` runs BEFORE
# `ci_runner` — this is the single most important line in chaos-gate.yml.
#
# A chaos gate with no load plane reproduces defect D1 *inside the pipeline*,
# which is the worst place for it: the job goes green, the badge says the
# resilience gate passed, and nothing was ever measured. Every invariant in
# every experiment is sourced from k6's client-side series; with no TestRun
# those series are empty, and an empty series is never a passing series.
#
# ConfigMap first:  kubectl create configmap ci-120rps -n load \
#                     --from-file=archive.js=profiles/steady_120rps.js
#
# The rate is 120 rps and NOT lowered for CI. `min_rps_floor: 90` is part of
# each hypothesis, so a CI profile below the floor would make every gate run
# INVALID — correct behaviour, useless gate. If the runner cannot hold 120 rps
# the answer is a bigger runner, never a smaller floor (the same reasoning that
# put t3.large rather than t3.medium in the cost table).
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: ci-120rps
  namespace: load
  labels:
    chaosproof.io/plane: load
    chaosproof.io/environment: ci
spec:
  parallelism: 1
  script:
    configMap:
      name: ci-120rps
      file: archive.js
  # The tag is what queries.client_queries(testrun) selects on. A run whose
  # tag does not match the one ci_runner was told to read produces empty
  # series -> INVALID, not a silent pass.
  arguments: -o experimental-prometheus-rw --tag testrun=ci-120rps
  runner:
    image: grafana/k6:2.2.0   # pinned to the plan version; never latest
    env:
      - name: TARGET_URL
        value: http://order-api.target-app:8080
      - name: LOAD_DURATION
        # Two gating experiments x (60s fault + 120s recovery), plus per-run
        # pre-flight, baseline and cleanup steady-state verification (up to
        # 420s each). 25m covers the pair with headroom; a generator that
        # expires mid-suite returns INVALID for the later runs — right
        # behaviour, wrong cause, and a confusing gate failure.
        value: "25m"
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: http://kps-kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: "p(99),p(95),avg,min,max"
      - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
        value: 5s
    resources:
      requests: { memory: 256Mi, cpu: 250m }
      limits: { memory: 512Mi }
